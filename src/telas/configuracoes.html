<!--

kind: tela
description: Preferências da sessão: tema, identidade e feature flags.
-->
{{nav:settings}}
<main class="atlas-pageMain">
  <div class="atlas-appContainer">
    <div class="atlas-pageHeader">
      <div class="atlas-pageTitleGroup">
        <span class="atlas-pageEyebrow">Preferências</span>
        <h1 class="atlas-pageTitle">Configurações</h1>
        <p class="atlas-pageSubtitle">Aparência, identidade e recursos experimentais desta sessão.</p>
      </div>
      <div class="atlas-pageActions">
        <span class="atlas-badgeTag atlas-badgeInfo">local</span>
      </div>
    </div>

    <section class="atlas-tableContainerCard">
      <div class="atlas-sectionCardHeader">
        <div class="atlas-tabs" role="tablist"><button type="button" role="tab" class="atlas-tabBtn atlas-tabBtnActive" aria-selected="true">Aparência</button><button type="button" role="tab" class="atlas-tabBtn" aria-selected="false">Identidade</button><button type="button" role="tab" class="atlas-tabBtn" aria-selected="false">Feature flags</button></div>
      </div>
      <div class="atlas-optionCards">
        <button type="button" class="atlas-modalActionOption atlas-modalActionOptionChecked" style="min-width:180px">
          <div><div class="atlas-modalActionLabel">Atlas escuro</div><div class="atlas-settingDesc">escuro</div></div>
          <span class="atlas-optionCheckCircle">✓</span>
        </button>
        <button type="button" class="atlas-modalActionOption" style="min-width:180px">
          <div><div class="atlas-modalActionLabel">Atlas claro</div><div class="atlas-settingDesc">claro</div></div>
          <span class="atlas-optionCheckCircle atlas-optionCheckCircleEmpty"></span>
        </button>
      </div>
    </section>
  </div>
</main>
